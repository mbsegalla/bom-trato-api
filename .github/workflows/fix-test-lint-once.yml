name: One-time test lint repair

on:
  push:
    branches:
      - chore/fix-test-lint
    paths:
      - '.github/workflows/fix-test-lint-once.yml'
      - 'fix-test-lint-once.mjs'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUSKY: '0'
      DATABASE_URL: postgresql://bom_trato_ci:ci_only_password@127.0.0.1:5432/bom_trato_ci?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bom_trato_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: bom_trato_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bom_trato_ci -d bom_trato_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Repair test lint diagnostics
        run: node fix-test-lint-once.mjs
      - name: Remove temporary files from the validation checkout
        run: rm -f fix-test-lint-once.mjs .github/workflows/fix-test-lint-once.yml
      - name: Full project lint
        run: pnpm lint --max-warnings=0
      - name: Full project Prettier
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Apply migrations and test
        env:
          PAYMENT_INTEGRATION_DATABASE_URL: postgresql://bom_trato_ci:ci_only_password@127.0.0.1:5432/bom_trato_ci?schema=public
        run: pnpm exec prisma migrate deploy && pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Commit validated changes to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'chore/fix-test-lint'
          git restore --source=HEAD --worktree -- fix-test-lint-once.mjs .github/workflows/fix-test-lint-once.yml
          git diff --check
          git add -- src test docs vitest.config.ts
          git diff --cached --name-only
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin refs/heads/chore/fix-test-lint
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})"
            git reset --soft FETCH_HEAD
            git commit -m 'test: resolve lint and typecheck diagnostics and normalize formatting'
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/chore/fix-test-lint
          fi
